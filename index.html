<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة التذاكر - الزهراني لوجستيك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #1a237e; color: white; height: 100vh; overflow: hidden; }
        
        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
        }
        
        .sidebar {
            background: #0d1b6b;
            padding: 20px;
            border-left: 5px solid #ffd700;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            padding: 15px;
            border: 5px solid #ffd700;
        }
        
        .main-display {
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        
        .ticket-display {
            flex: 1;
            background: white;
            border-radius: 30px;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1a237e;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .ticket-number {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
        }
        
        .ticket-arabic {
            font-size: 60px;
            color: #283593;
            margin-bottom: 30px;
        }
        
        .dept-name {
            font-size: 48px;
            font-weight: 800;
            margin-top: 20px;
        }
        
        .dept-en {
            font-size: 24px;
            color: #666;
        }
        
        .queue {
            background: #e8eaf6;
            border-radius: 20px;
            padding: 20px;
            margin: 20px;
            color: #1a237e;
        }
        
        .queue-list {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .queue-item {
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 700;
            border: 3px solid #283593;
        }
        
        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff5252;
        }
        
        .status-dot.connected {
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .depts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .dept-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            border: 3px solid transparent;
            color: #1a237e;
        }
        
        .dept-card.active {
            border-color: #ffd700;
            background: #fff8e1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <img src="https://i.ibb.co/1GHY3whz/bsxB90Z.png" alt="شعار الزهراني">
            </div>
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="color: #ffd700; font-size: 28px;">الزهراني لوجستيك</h1>
                <p style="color: #e8eaf6;">شاشة عرض التذاكر</p>
            </div>
            
            <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                <div style="color: #ffd700; margin-bottom: 5px;">العملاء في الانتظار</div>
                <div id="waitingCount" style="font-size: 48px; font-weight: 900;">0</div>
            </div>
            
            <div style="color: #e8eaf6; font-size: 14px;">
                آخر تحديث: <span id="lastUpdate">--:--</span>
            </div>
        </div>
        
        <div class="main-display">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1 style="font-size: 36px; color: white;" id="currentDept">المدير المالي</h1>
                <div style="font-size: 24px; color: #ffd700;" id="currentTime">--:--:--</div>
            </div>
            
            <div class="ticket-display">
                <div class="ticket-number" id="currentTicket">0000</div>
                <div class="ticket-arabic" id="currentTicketAr">٠٠٠٠</div>
                <div style="font-size: 24px; color: #666; margin-bottom: 30px;">رقم التذكرة الحالية</div>
                
                <div class="dept-name" id="deptNameAr">المدير المالي</div>
                <div class="dept-en" id="deptNameEn">CHIEF FINANCIAL OFFICER</div>
            </div>
            
            <div class="queue">
                <h3 style="margin-bottom: 15px;">قائمة الانتظار (<span id="queueCount">0</span>)</h3>
                <div class="queue-list" id="queueList">
                    <!-- التذاكر تظهر هنا -->
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <h3 style="color: white; margin-bottom: 15px;">الأقسام</h3>
                <div class="depts-grid" id="deptsGrid">
                    <!-- الأقسام تظهر هنا -->
                </div>
            </div>
        </div>
    </div>
    
    <div class="connection-status" id="connectionStatus">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">جاري الاتصال...</span>
    </div>

    <script>
        // =================== إعدادات Viber Base ===================
        const DISPLAY_ID = 'display_' + Math.random().toString(36).substr(2, 9);
        let currentDept = 'finance';
        let socket = null;
        
        // بيانات الأقسام
        const departments = {
            finance: { nameAr: "المدير المالي", nameEn: "CHIEF FINANCIAL OFFICER", color: "#1a237e" },
            ninja: { nameAr: "مشرف نينجا", nameEn: "NINJA SUPERVISOR", color: "#283593" },
            keemart: { nameAr: "مشرف كيمارت", nameEn: "KEMART SUPERVISOR", color: "#3949ab" },
            vehicles: { nameAr: "مسؤول المركبات", nameEn: "VEHICLES OFFICIAL", color: "#5c6bc0" },
            projects: { nameAr: "مدير المشاريع", nameEn: "PROJECTS MANAGER", color: "#7986cb" },
            hr: { nameAr: "مدير الموارد البشرية", nameEn: "HR MANAGER", color: "#9fa8da" }
        };
        
        // =================== WebSocket Connection ===================
        function connectWebSocket() {
            // استخدام WebSocket مباشرة
            const wsUrl = 'wss://ws.viberbase.com/display'; // أو خادمك الخاص
            
            updateStatus(false, 'جاري الاتصال...');
            
            // محاكاة الاتصال (استبدل هذا بـ WebSocket حقيقي)
            setTimeout(() => {
                updateStatus(true, 'متصل - جاهز');
                
                // محاكاة استقبال تذاكر جديدة
                setInterval(() => {
                    if (Math.random() > 0.7) { // 30% فرصة لتذكرة جديدة
                        simulateNewTicket();
                    }
                }, 8000);
                
                // محاكاة التبديل بين الأقسام
                setInterval(() => {
                    rotateDepartment();
                }, 15000);
                
            }, 2000);
        }
        
        function updateStatus(connected, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            if (connected) {
                dot.classList.add('connected');
            } else {
                dot.classList.remove('connected');
            }
            
            text.textContent = message;
        }
        
        // =================== إدارة التذاكر ===================
        function loadTickets() {
            // تهيئة البيانات إذا لم تكن موجودة
            Object.keys(departments).forEach(dept => {
                if (!localStorage.getItem('tickets_' + dept)) {
                    localStorage.setItem('tickets_' + dept, JSON.stringify([]));
                }
            });
        }
        
        function simulateNewTicket() {
            const depts = Object.keys(departments);
            const randomDept = depts[Math.floor(Math.random() * depts.length)];
            
            // الحصول على التذاكر الحالية
            let tickets = JSON.parse(localStorage.getItem('tickets_' + randomDept) || '[]');
            const newNumber = tickets.length + 1;
            
            // إضافة التذكرة
            tickets.push({
                number: newNumber,
                time: new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})
            });
            
            localStorage.setItem('tickets_' + randomDept, JSON.stringify(tickets));
            
            // تحديث العرض إذا كان هذا هو القسم الحالي
            if (randomDept === currentDept) {
                updateDisplay();
                announceTicket(newNumber, randomDept);
            }
            
            updateWaitingCount();
        }
        
        function announceTicket(number, dept) {
            const deptName = departments[dept].nameAr;
            const msg = `تذكرة جديدة رقم ${toArabicDigits(number)} قسم ${deptName}`;
            
            // استخدام Web Speech API
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(msg);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }
        
        // =================== تحديث العرض ===================
        function updateDisplay() {
            const dept = departments[currentDept];
            const tickets = JSON.parse(localStorage.getItem('tickets_' + currentDept) || '[]');
            
            // تحديث التذكرة الحالية
            const latestTicket = tickets.length > 0 ? tickets[tickets.length - 1].number : 0;
            
            document.getElementById('currentTicket').textContent = latestTicket || '0000';
            document.getElementById('currentTicketAr').textContent = toArabicDigits(latestTicket) || '٠٠٠٠';
            document.getElementById('deptNameAr').textContent = dept.nameAr;
            document.getElementById('deptNameEn').textContent = dept.nameEn;
            document.getElementById('currentDept').textContent = dept.nameAr;
            
            // تحديث قائمة الانتظار
            updateQueueDisplay(tickets);
            
            // تحديث شبكة الأقسام
            updateDeptsGrid();
            
            // تحديث الخلفية
            document.querySelector('.ticket-display').style.backgroundColor = dept.color + '20';
        }
        
        function updateQueueDisplay(tickets) {
            const queueList = document.getElementById('queueList');
            const queueCount = document.getElementById('queueCount');
            
            queueCount.textContent = tickets.length;
            queueList.innerHTML = '';
            
            // عرض آخر 8 تذاكر فقط
            const recentTickets = tickets.slice(-8);
            
            recentTickets.forEach(ticket => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.textContent = ticket.number;
                queueList.appendChild(div);
            });
        }
        
        function updateDeptsGrid() {
            const grid = document.getElementById('deptsGrid');
            grid.innerHTML = '';
            
            Object.entries(departments).forEach(([key, dept]) => {
                const tickets = JSON.parse(localStorage.getItem('tickets_' + key) || '[]');
                const count = tickets.length;
                
                const card = document.createElement('div');
                card.className = `dept-card ${key === currentDept ? 'active' : ''}`;
                card.onclick = () => switchDept(key);
                
                card.innerHTML = `
                    <div style="font-weight: 700; font-size: 16px;">${dept.nameAr}</div>
                    <div style="font-size: 24px; font-weight: 900; margin: 5px 0;">${count}</div>
                    <div style="font-size: 12px; color: #666;">في الانتظار</div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        function switchDept(deptKey) {
            currentDept = deptKey;
            updateDisplay();
        }
        
        function rotateDepartment() {
            const depts = Object.keys(departments);
            const currentIndex = depts.indexOf(currentDept);
            const nextIndex = (currentIndex + 1) % depts.length;
            switchDept(depts[nextIndex]);
        }
        
        // =================== وظائف مساعدة ===================
        function toArabicDigits(num) {
            if (!num) return '٠٠٠٠';
            return num.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleTimeString('ar-SA');
            document.getElementById('lastUpdate').textContent = 
                now.toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'});
        }
        
        function updateWaitingCount() {
            let total = 0;
            Object.keys(departments).forEach(dept => {
                const tickets = JSON.parse(localStorage.getItem('tickets_' + dept) || '[]');
                total += tickets.length;
            });
            document.getElementById('waitingCount').textContent = total;
        }
        
        // =================== التهيئة ===================
        function init() {
            loadTickets();
            updateDisplay();
            updateTime();
            updateWaitingCount();
            setInterval(updateTime, 1000);
            connectWebSocket();
            
            // بدء التدوير التلقائي
            setInterval(rotateDepartment, 15000);
        }
        
        // بدء التطبيق
        window.onload = init;
    </script>
</body>
</html>
