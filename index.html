<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة التذاكر - الزهراني لوجستيك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1a237e;
            --secondary-blue: #283593;
            --accent-gold: #ffd700;
            --light-blue: #e8eaf6;
            --white: #ffffff;
            --success-green: #4CAF50;
            --dark-blue: #0d1b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 95vw;
            height: 90vh;
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
        }

        /* Sidebar - Company Info */
        .sidebar {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            border-radius: 30px;
            padding: 30px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 5px solid var(--accent-gold);
        }

        .logo {
            width: 150px;
            height: 150px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            border: 8px solid var(--accent-gold);
        }

        .logo img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .company-name {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-gold);
            text-align: center;
            margin-bottom: 10px;
        }

        .system-name {
            font-size: 20px;
            color: var(--light-blue);
            text-align: center;
            margin-bottom: 40px;
        }

        .status-indicator {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success-green);
            animation: pulse 2s infinite;
        }

        /* Main Display Area */
        .main-display {
            background: white;
            border-radius: 30px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 5px solid var(--accent-gold);
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--light-blue);
        }

        .current-dept {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-blue);
        }

        .current-time {
            font-size: 22px;
            color: var(--secondary-blue);
            font-weight: 700;
        }

        /* Ticket Display */
        .ticket-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .ticket-number {
            font-size: 120px;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 1;
            direction: ltr;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.1);
        }

        .ticket-number-arabic {
            font-size: 60px;
            color: var(--secondary-blue);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .ticket-label {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
        }

        .dept-info {
            text-align: center;
            margin-top: 20px;
        }

        .dept-name {
            font-size: 36px;
            font-weight: 800;
            color: var(--dark-blue);
            margin-bottom: 10px;
        }

        .dept-details {
            font-size: 20px;
            color: #555;
        }

        /* Tickets Queue */
        .queue-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 3px solid var(--light-blue);
        }

        .queue-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .queue-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
        }

        .queue-item {
            background: var(--light-blue);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--dark-blue);
            border: 2px solid var(--secondary-blue);
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .new-ticket {
            animation: slideIn 0.5s ease;
        }

        /* Controls */
        .controls {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary-blue);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 3px solid var(--accent-gold);
            transition: all 0.3s;
        }

        .control-btn:hover {
            transform: scale(1.1);
            background: var(--accent-gold);
        }

        /* Announcement */
        .announcement {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-blue);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid var(--accent-gold);
            z-index: 1000;
            animation: slideIn 0.5s ease;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--primary-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="color: white; font-size: 24px; font-weight: 700;">جاري تحميل نظام التذاكر...</div>
    </div>

    <div class="controls">
        <div class="control-btn" onclick="toggleSound()" title="كتم/تشغيل الصوت">
            <i class="fas fa-volume-up"></i>
        </div>
        <div class="control-btn" onclick="toggleFullscreen()" title="ملء الشاشة">
            <i class="fas fa-expand"></i>
        </div>
        <div class="control-btn" onclick="refreshTickets()" title="تحديث">
            <i class="fas fa-sync-alt"></i>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="https://i.ibb.co/1GHY3whz/bsxB90Z.png" alt="شعار الزهراني">
            </div>
            <div class="company-name">الزهراني لوجستيك</div>
            <div class="system-name">نظام إدارة التذاكر الذكي</div>
            
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>النظام يعمل - متصل</span>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <div style="font-size: 18px; color: var(--accent-gold); margin-bottom: 10px;">
                    <i class="fas fa-users"></i> العملاء في الانتظار
                </div>
                <div id="waitingCount" style="font-size: 42px; font-weight: 900;">0</div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <div style="font-size: 16px; color: var(--light-blue);">
                    آخر تحديث: <span id="lastUpdate">--:--</span>
                </div>
            </div>
        </div>

        <!-- Main Display -->
        <div class="main-display">
            <div class="header">
                <div class="current-dept" id="currentDepartment">إنتظار التذاكر...</div>
                <div class="current-time" id="currentTime">--:--:--</div>
            </div>

            <div class="ticket-display" id="ticketDisplay">
                <div class="ticket-number" id="currentTicket">0000</div>
                <div class="ticket-number-arabic" id="currentTicketArabic">٠٠٠٠</div>
                <div class="ticket-label">رقم التذكرة الحالية</div>
                
                <div class="dept-info">
                    <div class="dept-name" id="deptNameAr">إنتظار التعيين</div>
                    <div class="dept-details" id="deptNameEn">Waiting for Assignment</div>
                </div>
            </div>

            <div class="queue-section">
                <div class="queue-title">
                    <i class="fas fa-list-ol"></i> قائمة الانتظار
                </div>
                <div class="queue-list" id="queueList">
                    <!-- سيتم ملؤها تلقائياً -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // تعريف الأقسام
        const departments = {
            finance: {
                nameAr: "المدير المالي",
                nameEn: "CHIEF FINANCIAL OFFICER",
                location: "الطابق الثالث - مكتب 301",
                color: "#1a237e"
            },
            ninja: {
                nameAr: "مشرفين نينجا",
                nameEn: "NINJA SUPERVISOR",
                location: "الطابق الثاني - مكتب 205",
                color: "#283593"
            },
            keemart: {
                nameAr: "مشرف كيمارت",
                nameEn: "KEMART SUPERVISOR",
                location: "الطابق الأول - مكتب 103",
                color: "#3949ab"
            },
            vehicles: {
                nameAr: "مسؤول المركبات",
                nameEn: "VEHICLES OFFICIAL",
                location: "الدور الأرضي - مكتب 005",
                color: "#5c6bc0"
            },
            projects: {
                nameAr: "مدير المشاريع التشغيلية",
                nameEn: "OPERATIONAL PROJECTS MANAGER",
                location: "الطابق الرابع - مكتب 401",
                color: "#7986cb"
            },
            hr: {
                nameAr: "مدير الموارد البشرية",
                nameEn: "HUMAN RESOURCES MANAGER",
                location: "الطابق الثالث - مكتب 305",
                color: "#9fa8da"
            }
        };

        // المتغيرات العامة
        let currentTickets = {
            finance: { number: 0, queue: [] },
            ninja: { number: 0, queue: [] },
            keemart: { number: 0, queue: [] },
            vehicles: { number: 0, queue: [] },
            projects: { number: 0, queue: [] },
            hr: { number: 0, queue: [] }
        };

        let soundEnabled = true;
        let currentDisplayDept = 'finance';
        let autoRotateInterval;

        // تحويل الأرقام للعربية
        function toArabicDigits(n) {
            return n.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
        }

        // تحديث الوقت
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-SA');
            document.getElementById('currentTime').textContent = timeStr;
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('ar-SA', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        // تحديث العداد
        function updateWaitingCount() {
            let total = 0;
            Object.values(currentTickets).forEach(dept => {
                total += dept.queue.length;
            });
            document.getElementById('waitingCount').textContent = total;
        }

        // تحديث عرض التذكرة
        function updateTicketDisplay() {
            const dept = departments[currentDisplayDept];
            const ticketData = currentTickets[currentDisplayDept];
            
            if (ticketData.number > 0) {
                document.getElementById('currentTicket').textContent = ticketData.number;
                document.getElementById('currentTicketArabic').textContent = toArabicDigits(ticketData.number);
                document.getElementById('deptNameAr').textContent = dept.nameAr;
                document.getElementById('deptNameEn').textContent = dept.nameEn;
                document.getElementById('currentDepartment').textContent = dept.nameAr;
                
                // تحديث لون الخلفية
                document.getElementById('ticketDisplay').style.background = `linear-gradient(135deg, ${dept.color}20 0%, ${dept.color}10 100%)`;
            }
        }

        // تحديث قائمة الانتظار
        function updateQueueDisplay() {
            const queueList = document.getElementById('queueList');
            const currentQueue = currentTickets[currentDisplayDept].queue;
            
            queueList.innerHTML = '';
            currentQueue.forEach((ticket, index) => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.textContent = ticket;
                queueList.appendChild(div);
            });
        }

        // إضافة تذكرة جديدة
        function addNewTicket(department) {
            const dept = currentTickets[department];
            dept.number++;
            const ticketNum = dept.number;
            dept.queue.push(ticketNum);
            
            // إذا كانت هذه هي الشاشة الحالية، تحديث العرض
            if (department === currentDisplayDept) {
                updateTicketDisplay();
                updateQueueDisplay();
                if (soundEnabled) {
                    announceTicket(ticketNum, department);
                }
            }
            
            updateWaitingCount();
            saveToLocalStorage();
            
            // عرض إشعار
            showAnnouncement(`تم إضافة تذكرة جديدة للقسم ${departments[department].nameAr}`);
        }

        // استدعاء تذكرة
        function callTicket(department) {
            const dept = currentTickets[department];
            if (dept.queue.length > 0) {
                const calledTicket = dept.queue.shift(); // إزالة أول تذكرة
                if (department === currentDisplayDept) {
                    updateQueueDisplay();
                    if (soundEnabled) {
                        speakAnnouncement(calledTicket, department);
                    }
                }
                updateWaitingCount();
                saveToLocalStorage();
                
                showAnnouncement(`تم استدعاء التذكرة ${calledTicket} للقسم ${departments[department].nameAr}`);
            }
        }

        // الإعلان الصوتي
        function announceTicket(ticketNumber, department) {
            const dept = departments[department];
            const msg = new SpeechSynthesisUtterance(
                `تذكرة جديدة رقم ${toArabicDigits(ticketNumber)}، قسم ${dept.nameAr}`
            );
            msg.lang = 'ar-SA';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function speakAnnouncement(ticketNumber, department) {
            const dept = departments[department];
            const msg = new SpeechSynthesisUtment(
                `رقم ${toArabicDigits(ticketNumber)}، قسم ${dept.nameAr}، ${dept.location}`
            );
            msg.lang = 'ar-SA';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        // إظهار إشعار
        function showAnnouncement(message) {
            const ann = document.createElement('div');
            ann.className = 'announcement';
            ann.textContent = message;
            ann.innerHTML = `<i class="fas fa-bullhorn" style="margin-left: 10px;"></i> ${message}`;
            
            document.body.appendChild(ann);
            
            setTimeout(() => {
                ann.remove();
            }, 5000);
        }

        // حفظ البيانات
        function saveToLocalStorage() {
            localStorage.setItem('ticketSystemData', JSON.stringify(currentTickets));
        }

        // تحميل البيانات
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('ticketSystemData');
            if (saved) {
                currentTickets = JSON.parse(saved);
                updateTicketDisplay();
                updateQueueDisplay();
                updateWaitingCount();
            }
        }

        // التحكم في الصوت
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.querySelector('.fa-volume-up').parentElement;
            if (soundEnabled) {
                btn.innerHTML = '<i class="fas fa-volume-up"></i>';
            } else {
                btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                window.speechSynthesis.cancel();
            }
        }

        // ملء الشاشة
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // تحديث يدوي
        function refreshTickets() {
            updateTicketDisplay();
            updateQueueDisplay();
            updateWaitingCount();
            showAnnouncement('تم تحديث البيانات');
        }

        // التدوير التلقائي بين الأقسام
        function startAutoRotate() {
            clearInterval(autoRotateInterval);
            autoRotateInterval = setInterval(() => {
                const depts = Object.keys(departments);
                const currentIndex = depts.indexOf(currentDisplayDept);
                const nextIndex = (currentIndex + 1) % depts.length;
                currentDisplayDept = depts[nextIndex];
                
                updateTicketDisplay();
                updateQueueDisplay();
            }, 10000); // كل 10 ثواني
        }

        // التهيئة
        function init() {
            // تحميل البيانات
            loadFromLocalStorage();
            
            // إخفاء شاشة التحميل
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'grid';
                
                // بدء التحديثات
                updateTime();
                setInterval(updateTime, 1000);
                
                // بدء التدوير التلقائي
                startAutoRotate();
                
                // محاكاة بيانات للاختبار
                setTimeout(() => {
                    if (currentTickets.finance.number === 0) {
                        // إضافة بيانات تجريبية
                        currentTickets.finance.number = 5;
                        currentTickets.finance.queue = [1, 2, 3, 4, 5];
                        currentTickets.ninja.number = 3;
                        currentTickets.ninja.queue = [1, 2, 3];
                        updateTicketDisplay();
                        updateQueueDisplay();
                        updateWaitingCount();
                    }
                }, 1000);
                
                // محاكاة إضافة تذاكر جديدة
                setInterval(() => {
                    const depts = Object.keys(departments);
                    const randomDept = depts[Math.floor(Math.random() * depts.length)];
                    if (Math.random() > 0.7) { // 30% فرصة
                        addNewTicket(randomDept);
                    }
                }, 15000);
                
            }, 2000);
        }

        // بدء التشغيل
        window.onload = init;
    </script>
</body>
</html>
